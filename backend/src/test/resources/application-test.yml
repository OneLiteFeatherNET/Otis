# In-memory H2 for tests: no Docker, same on ubuntu/windows/macos CI.
# Each application context gets its own database via the random suffix.
# The schema comes from the Flyway migrations; Hibernate only validates that the mapping matches.
datasources:
  default:
    url: jdbc:h2:mem:otis-${random.uuid};DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
    dialect: H2
jpa:
  default:
    properties:
      hibernate:
        hbm2ddl:
          auto: validate
