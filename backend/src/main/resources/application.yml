micronaut:
  serde:
    jackson:
      parser-features:
  application:
    name: Otis API
  # RFC 9457 problem details for every error response; never expose stack traces.
  problem:
    stack-trace: false
  metrics:
    enabled: true
    export:
      prometheus:
        enabled: true
        step: PT1M
        descriptions: true

# Datasource
datasources:
  default:
    url: ${JDBC_URL:`jdbc:mariadb://127.0.0.1:3336/otis`}
    password: ${JDBC_PASSWORD:`otis`}
    username: ${JDBC_USER:`root`}
    driver-class-name: ${JDBC_DRIVER:`org.mariadb.jdbc.Driver`}
# JPA
jpa:
  default:
    properties:
      hibernate:
        hbm2ddl:
          auto: update
        show_sql: false

# OpenTelemetry — tracing is disabled unless OTEL_TRACES_EXPORTER=otlp is set
# (do this in the Docker/prod container). Metrics stay on Prometheus/Micrometer.
otel:
  service:
    name: ${OTEL_SERVICE_NAME:otis}
  traces:
    exporter: ${OTEL_TRACES_EXPORTER:none}
  metrics:
    exporter: none
  logs:
    exporter: none
  exporter:
    otlp:
      protocol: grpc
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:`http://localhost:4317`}
  exclusions:
    - /health
    - /health/.*
    - /prometheus
    - /swagger
    - /swagger/.*
    - /swagger-ui/.*

# Management endpoints — /health for liveness/readiness probes,
# /prometheus for metrics scraping (both non-sensitive for internal scraping).
endpoints:
  health:
    enabled: true
    sensitive: false
    details-visible: ANONYMOUS
  prometheus:
    enabled: true
    sensitive: false

# OpenAPI
router:
  static-resources:
    swagger:
      paths: classpath:META-INF/swagger
      mapping: /swagger/**
    swagger-ui:
      paths: classpath:META-INF/swagger/views/swagger-ui
      mapping: /swagger-ui/**

# Flyway — schema migrations. Existing databases without history are baselined at version 1
# (the schema Hibernate created before Flyway), so V1 only ever runs on empty databases and
# no existing table is touched. FLYWAY_ENABLED=false lets the service start without migrating.
# The migration directory per database vendor is chosen by VendorMigrationLocations.
flyway:
  datasources:
    default:
      enabled: ${FLYWAY_ENABLED:true}
      baseline-on-migrate: true
      baseline-version: 1

# Account link events (transactional outbox -> Kafka). Everything is off unless KAFKA_ENABLED=true:
# then link changes write outbox rows and the relay publishes them to the topic otis.account-links.
# Note: micronaut-kafka has no global enabled switch; every Kafka bean is gated by otis.events.enabled,
# and the Kafka health indicator (which would probe localhost:9092) is switched off with it.
kafka:
  bootstrap:
    servers: ${KAFKA_BOOTSTRAP_SERVERS:`localhost:9092`}
  health:
    enabled: ${KAFKA_ENABLED:false}
otis:
  events:
    enabled: ${KAFKA_ENABLED:false}
    # Identifies the relay replica that holds a lease on an outbox row (the pod name in Kubernetes).
    instance-id: ${HOSTNAME:}
