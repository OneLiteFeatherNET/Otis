openapi: 3.0.1
info:
  title: Otis API
  description: Simple user management system
  contact:
    name: Management
    url: https://onelitefeather.net
    email: admin@onelitefeather.net
  license:
    name: Apache-2.0
  version: 1.1.0
tags:
- name: Player
  description: Player management
- name: Player settings
  description: Per-player settings identified by Adventure keys
- name: Account links
  description: Links between players and external accounts, verified by one-time codes
paths:
  /otis:
    post:
      tags:
      - Player
      summary: Add a new Otis player
      description: This endpoint allows you to add a new Otis player to the database.
      operationId: addPlayer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                playerDTO:
                  $ref: '#/components/schemas/OtisPlayerDTO'
        required: true
      responses:
        '200':
          description: Player added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtisPlayerDTO'
        '400':
          description: The request is invalid, e.g. a path value or body member violates a constraint
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          description: The player could not be added to the database
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /otis/all:
    get:
      tags:
      - Player
      summary: Get all Otis players
      description: This endpoint retrieves all Otis players from the database.
      operationId: getAllPlayers
      parameters:
      - name: pageable
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Pageable'
      responses:
        '200':
          description: Players retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtisPlayerDTO'
        '400':
          description: The request is invalid, e.g. a path value or body member violates a constraint
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: No players found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          description: Unexpected server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /otis/byId/{owner}:
    get:
      tags:
      - Player
      summary: Get Otis player by ID
      description: This endpoint retrieves an Otis player by their UUID.
      operationId: getPlayerById
      parameters:
      - name: owner
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Player was successfully found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtisPlayerDTO'
        '400':
          description: The request is invalid, e.g. a path value or body member violates a constraint
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Player not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          description: Unexpected server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /otis/byName/{owner}:
    get:
      tags:
      - Player
      summary: Get Otis player by name
      description: This endpoint retrieves an Otis player by their name.
      operationId: getPlayerByName
      parameters:
      - name: owner
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Player was successfully found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtisPlayerDTO'
        '400':
          description: The request is invalid, e.g. a path value or body member violates a constraint
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Player not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          description: Unexpected server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /otis/delete/{owner}:
    post:
      tags:
      - Player
      summary: Delete an Otis player
      description: This endpoint allows you to delete an Otis player from the database.
      operationId: deletePlayer
      parameters:
      - name: owner
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Player deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtisPlayerDTO'
        '400':
          description: The request is invalid, e.g. a path value or body member violates a constraint
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Player not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          description: Unexpected server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /otis/update/{owner}:
    post:
      tags:
      - Player
      summary: Update an existing Otis player
      description: This endpoint allows you to update an existing Otis player in the database.
      operationId: updatePlayer
      parameters:
      - name: owner
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                playerDTO:
                  $ref: '#/components/schemas/OtisPlayerDTO'
        required: true
      responses:
        '200':
          description: Player updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtisPlayerDTO'
        '400':
          description: Bad request, player UUID does not match the owner
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Player not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          description: Unexpected server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /search/byId/{id}:
    get:
      tags:
      - Player
      - Search
      summary: Search for a player by their ID
      description: Returns the player information if found, otherwise returns 404 Not Found.
      operationId: searchById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Player found and returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtisPlayerDTO'
        '400':
          description: The request is invalid, e.g. a path value or body member violates a constraint
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Player not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          description: Unexpected server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /search/byName/{name}:
    get:
      tags:
      - Player
      - Search
      summary: Search for a player by their name
      description: Returns the player information if found, otherwise returns 404 Not Found.
      operationId: searchByName
      parameters:
      - name: name
        in: path
        required: true
        schema:
          maxLength: 16
          minLength: 3
          pattern: ^[a-zA-Z0-9_]+$
          type: string
          x-pattern-message: Username can only contain alphanumeric characters and underscores.
      responses:
        '200':
          description: Player found and returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtisPlayerDTO'
        '400':
          description: The request is invalid, e.g. a path value or body member violates a constraint
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Player not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          description: Unexpected server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /v1/players/{playerUuid}/settings:
    get:
      tags:
      - Player settings
      summary: List the settings of a player
      description: Returns all settings of the player, or only those of the given namespaces.
      operationId: listPlayerSettings
      parameters:
      - name: playerUuid
        in: path
        description: Mojang uuid of the player; the player must be stored in Otis.
        required: true
        schema:
          type: string
          format: uuid
      - name: namespace
        in: query
        description: Only return settings of this namespace, e.g. lobby; repeat the parameter for several namespaces.
        explode: true
        schema:
          type: array
          nullable: true
          items:
            type: string
      responses:
        '200':
          description: The settings, possibly an empty list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlayerSettingDTO'
        '404':
          description: Player not found (problem type player-not-found)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '400':
          description: The request is invalid, e.g. the player uuid is malformed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          description: Unexpected server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /v1/players/{playerUuid}/settings/{key}:
    get:
      tags:
      - Player settings
      summary: Get one setting of a player
      description: Returns the setting stored under the key.
      operationId: getPlayerSetting
      parameters:
      - name: playerUuid
        in: path
        description: Mojang uuid of the player; the player must be stored in Otis.
        required: true
        schema:
          type: string
          format: uuid
      - name: key
        in: path
        description: Setting key in Adventure key syntax, namespace:value. Use the namespace olf for generic settings shared by all services and the namespace of your game for game-specific ones. The namespace minecraft is reserved.
        required: true
        schema:
          type: string
          format: adventure-key
          example: lobby:player_hider
      responses:
        '200':
          description: The setting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerSettingDTO'
        '404':
          description: Player or setting not found (problem types player-not-found, setting-not-found)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '400':
          description: Invalid key (problem types missing-namespace, reserved-namespace, invalid-setting-key)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          description: Unexpected server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    put:
      tags:
      - Player settings
      summary: Store a setting of a player
      description: Creates the setting or replaces its value (last write wins). Putting a value that is semantically equal to the stored one changes nothing and keeps version and updatedAt.
      operationId: putPlayerSetting
      parameters:
      - name: playerUuid
        in: path
        description: Mojang uuid of the player; the player must be stored in Otis.
        required: true
        schema:
          type: string
          format: uuid
      - name: key
        in: path
        description: Setting key in Adventure key syntax, namespace:value. Use the namespace olf for generic settings shared by all services and the namespace of your game for game-specific ones. The namespace minecraft is reserved.
        required: true
        schema:
          type: string
          format: adventure-key
          example: lobby:player_hider
      requestBody:
        description: 'The setting value: any JSON value (object, array, string, number, boolean or null), at most 64 KiB serialized.'
        content:
          application/json:
            schema:
              nullable: true
        required: true
      responses:
        '201':
          description: The setting was created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerSettingDTO'
        '200':
          description: The setting existed; it was replaced or, for an equal value, left unchanged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerSettingDTO'
        '404':
          description: Player not found (problem type player-not-found)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '400':
          description: Invalid key or body (problem types missing-namespace, reserved-namespace, invalid-setting-key, invalid-setting-value)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '413':
          description: The value exceeds 64 KiB (problem type setting-value-too-large)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          description: Unexpected server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    delete:
      tags:
      - Player settings
      summary: Delete a setting of a player
      description: Removes the setting. Deleting a setting that does not exist succeeds as well.
      operationId: deletePlayerSetting
      parameters:
      - name: playerUuid
        in: path
        description: Mojang uuid of the player; the player must be stored in Otis.
        required: true
        schema:
          type: string
          format: uuid
      - name: key
        in: path
        description: Setting key in Adventure key syntax, namespace:value. Use the namespace olf for generic settings shared by all services and the namespace of your game for game-specific ones. The namespace minecraft is reserved.
        required: true
        schema:
          type: string
          format: adventure-key
          example: lobby:player_hider
      responses:
        '204':
          description: The setting does not exist (any more)
        '404':
          description: Player not found (problem type player-not-found)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '400':
          description: Invalid key (problem types missing-namespace, reserved-namespace, invalid-setting-key)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          description: Unexpected server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /v1/link-codes/redeem:
    post:
      tags:
      - Account links
      summary: Redeem a link code
      description: Consumes a one-time code and links the player of the code to the external account. Unknown, expired, used and foreign-provider codes are answered identically.
      operationId: redeemLinkCode
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedeemRequestDTO'
        required: true
      responses:
        '201':
          description: The verified link and its player
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkLookupDTO'
        '400':
          description: Invalid request (problem types unsupported-provider, constraint violations)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Conflict; the code stays redeemable (problem types external-account-already-linked, provider-already-linked)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '410':
          description: The code is invalid or expired (problem type link-code-invalid)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          description: Unexpected server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /v1/links/{provider}/{externalId}:
    get:
      tags:
      - Account links
      summary: Find the player of an external account
      description: Returns the player and link of a verified external account. Unverified links are never found.
      operationId: lookupLink
      parameters:
      - name: provider
        in: path
        description: 'Provider: discord, twitch, youtube, x, tiktok or github.'
        required: true
        schema:
          type: string
      - name: externalId
        in: path
        description: Id of the external account at the provider.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The player and the verified link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkLookupDTO'
        '400':
          description: Invalid request (problem type unsupported-provider)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: No verified link (problem type link-not-found)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          description: Unexpected server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /v1/players/{playerUuid}/link-codes:
    post:
      tags:
      - Account links
      summary: Issue a link code for a player
      description: Issues a one-time code (valid 10 minutes) the player enters at the external service. A previous open code of the same provider is revoked. At most 5 codes per player and hour.
      operationId: createLinkCode
      parameters:
      - name: playerUuid
        in: path
        description: Mojang uuid of the player; the player must be stored in Otis.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkCodeRequestDTO'
        required: true
      responses:
        '201':
          description: The code; it is shown only once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkCodeDTO'
        '400':
          description: Invalid request (problem types unsupported-provider, constraint violations)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Player not found (problem type player-not-found)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '429':
          description: Too many codes (problem type link-code-rate-limited)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          description: Unexpected server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /v1/players/{playerUuid}/links:
    get:
      tags:
      - Account links
      summary: List the links of a player
      description: Returns the verified and unverified links of the player.
      operationId: listPlayerLinks
      parameters:
      - name: playerUuid
        in: path
        description: Mojang uuid of the player; the player must be stored in Otis.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The links, possibly an empty list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountLinkDTO'
        '404':
          description: Player not found (problem type player-not-found)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '400':
          description: The request is invalid, e.g. the player uuid is malformed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          description: Unexpected server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /v1/players/{playerUuid}/links/{provider}:
    put:
      tags:
      - Account links
      summary: Set an unverified link of a player
      description: Stores a public, unverified link (handle or https URL on the provider's domain) and replaces a previous unverified link of the provider. A verified link is never overwritten.
      operationId: putPlayerLink
      parameters:
      - name: playerUuid
        in: path
        description: Mojang uuid of the player; the player must be stored in Otis.
        required: true
        schema:
          type: string
          format: uuid
      - name: provider
        in: path
        description: 'Provider: discord, twitch, youtube, x, tiktok or github.'
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileLinkRequestDTO'
        required: true
      responses:
        '200':
          description: The stored link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountLinkDTO'
        '400':
          description: Invalid request (problem types unsupported-provider, invalid-link-value)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Player not found (problem type player-not-found)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: The player has a verified link for the provider (problem type provider-already-linked)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          description: Unexpected server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    delete:
      tags:
      - Account links
      summary: Remove a link of a player
      description: Removes the verified or unverified link of the provider. Removing a link that does not exist succeeds as well.
      operationId: deletePlayerLink
      parameters:
      - name: playerUuid
        in: path
        description: Mojang uuid of the player; the player must be stored in Otis.
        required: true
        schema:
          type: string
          format: uuid
      - name: provider
        in: path
        description: 'Provider: discord, twitch, youtube, x, tiktok or github.'
        required: true
        schema:
          type: string
      responses:
        '204':
          description: The player has no link for the provider (any more)
        '400':
          description: Invalid request (problem type unsupported-provider)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Player not found (problem type player-not-found)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          description: Unexpected server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
components:
  schemas:
    OtisPlayerDTO:
      type: object
      properties:
        uuid:
          type: string
          description: Unique identifier for the player in the Otis system.
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        playerUuid:
          type: string
          description: Unique identifier for the player from mojang.
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174001
        playerName:
          maximum: 16
          minimum: 3
          maxLength: 16
          minLength: 3
          pattern: ^[a-zA-Z0-9_]+$
          type: string
          description: The player's username.
          format: username
          example: Player123
          x-pattern-message: Username can only contain alphanumeric characters and underscores.
          x-size-message: Username must be between 3 and 16 characters.
        firstJoin:
          type: integer
          description: The timestamp of the player's first join in milliseconds since epoch.
          format: int64
          example: 1633072800000
        lastJoin:
          type: integer
          description: The timestamp of the player's last join in milliseconds since epoch.
          format: int64
          example: 1633072800000
        profileTextures:
          type: object
          additionalProperties: true
          description: A map containing the player's profile textures, such as skin and cape.
        locale:
          type: string
          description: The locale of the player, used for localization purposes.
          format: locale
          example: en-US
    Pageable:
      required:
      - size
      - sort
      type: object
      allOf:
      - $ref: '#/components/schemas/Sort'
      - properties:
          number:
            type: integer
            format: int32
          size:
            type: integer
            format: int32
          mode:
            $ref: '#/components/schemas/Pageable.Mode'
          sort:
            $ref: '#/components/schemas/Sort'
    Pageable.Mode:
      type: string
      enum:
      - CURSOR_NEXT
      - CURSOR_PREVIOUS
      - OFFSET
    Sort:
      required:
      - orderBy
      type: object
      properties:
        orderBy:
          type: array
          items:
            $ref: '#/components/schemas/Sort.Order'
    Sort.Order:
      required:
      - direction
      - ignoreCase
      - property
      type: object
      properties:
        ignoreCase:
          type: boolean
        direction:
          $ref: '#/components/schemas/Sort.Order.Direction'
        property:
          type: string
        ascending:
          type: boolean
    Sort.Order.Direction:
      type: string
      enum:
      - ASC
      - DESC
    ProblemDetail:
      required:
      - status
      - title
      - type
      type: object
      properties:
        type:
          type: string
          description: URI identifying the kind of problem, 'about:blank' when there is no more specific
            type.
          example: https://otis.onelitefeather.net/problems/constraint-violation
        title:
          type: string
          description: Short, human-readable summary of the problem type.
          example: Constraint Violation
        status:
          type: integer
          description: HTTP status code of the response.
          format: int32
          example: 400
        detail:
          type: string
          description: Explanation specific to this occurrence of the problem.
        instance:
          type: string
          description: URI identifying this occurrence of the problem.
        traceId:
          type: string
          description: W3C trace id of the request, present while tracing is enabled.
          example: 4bf92f3577b34da6a3ce929d0e0e4736
        violations:
          type: array
          description: 'Present for constraint violations: one entry per violated constraint.'
          items:
            $ref: '#/components/schemas/ProblemViolation'
      additionalProperties: true
      description: RFC 9457 problem details. Further extension members may be present.
    ProblemViolation:
      type: object
      properties:
        field:
          type: string
          description: Path of the invalid input.
          example: add.playerDTO.playerName
        message:
          type: string
          description: What is wrong with the input.
          example: Username must be between 3 and 16 characters.
      description: A violated request constraint.
    PlayerSettingDTO:
      type: object
      properties:
        key:
          type: string
          description: Setting key in Adventure key syntax; the namespace separates generic settings (olf) from game-specific ones.
          format: adventure-key
          example: lobby:player_hider
        value:
          description: 'The setting value: any JSON value (object, array, string, number, boolean or null), stored and returned without interpretation.'
          nullable: true
          allOf:
          - type: object
        version:
          minimum: 1
          type: integer
          description: Version of the setting, starting at 1 and increased with every change of the value.
          format: int64
          example: 1
        updatedAt:
          type: string
          description: Instant of the last change of the value.
          format: date-time
          example: 2026-01-01 12:00:00+00:00
      description: A stored setting as exposed by the API.
    LinkCodeDTO:
      type: object
      properties:
        code:
          pattern: ^[0-9A-HJKMNP-TV-Z]{4}-[0-9A-HJKMNP-TV-Z]{4}$
          type: string
          description: 'The one-time link code: two groups of four Crockford Base32 characters. Shown only once.'
          example: K7Q4-MZ2A
        provider:
          type: string
          description: Provider the code was issued for.
          example: discord
        expiresAt:
          type: string
          description: Instant after which the code can no longer be redeemed (10 minutes after issue).
          format: date-time
          example: 2026-01-01 12:10:00+00:00
    LinkCodeRequestDTO:
      required:
      - provider
      type: object
      properties:
        provider:
          maxLength: 32
          minLength: 1
          type: string
          description: 'Provider to link: discord, twitch, youtube, x, tiktok or github.'
          example: discord
      description: Requests a link code.
    RedeemRequestDTO:
      required:
      - code
      - externalId
      - provider
      type: object
      properties:
        code:
          maxLength: 32
          minLength: 1
          type: string
          description: The link code as received by the player; case-insensitive, the dash is optional.
          example: K7Q4-MZ2A
        provider:
          maxLength: 32
          minLength: 1
          type: string
          description: 'Provider the code was issued for: discord, twitch, youtube, x, tiktok or github.'
          example: discord
        externalId:
          maxLength: 64
          minLength: 1
          type: string
          description: Stable id of the external account, as authenticated by the redeeming service.
          example: '123456789012345678'
        displayName:
          maxLength: 100
          type: string
          description: Optional human-readable name of the external account.
          nullable: true
          example: meinerlp
    AccountLinkDTO:
      type: object
      properties:
        provider:
          type: string
          description: Provider of the link.
          example: discord
        externalId:
          type: string
          description: Id of the external account; only set for verified links.
          nullable: true
          example: '123456789012345678'
        value:
          type: string
          description: Public handle or https URL of an unverified link; only set for unverified links.
          nullable: true
          example: https://www.youtube.com/@onelitefeather
        displayName:
          type: string
          description: Human-readable account name of a verified link.
          nullable: true
          example: meinerlp
        verified:
          type: boolean
          description: True if the link was proven with a link code, false for a public claim.
          example: true
        linkedAt:
          type: string
          description: Instant the link was created or last replaced.
          format: date-time
          example: 2026-01-01 12:00:00+00:00
      description: The link.
    LinkLookupDTO:
      type: object
      properties:
        playerUuid:
          type: string
          description: Mojang uuid of the player the link belongs to.
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174001
        link:
          description: The link.
          allOf:
          - $ref: '#/components/schemas/AccountLinkDTO'
    ProfileLinkRequestDTO:
      required:
      - value
      type: object
      properties:
        value:
          maxLength: 200
          minLength: 1
          type: string
          description: A handle of the provider or an https URL on the provider's own domain; at most 200 characters.
          example: https://www.youtube.com/@onelitefeather
